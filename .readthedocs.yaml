version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    pre_build:
      # Generated at build time rather than committed, so the API pages cannot go stale
      # when a module is added or renamed.
      - sphinx-apidoc -o docs/source caldav_cal_api --force

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - requirements: docs/requirements.txt
